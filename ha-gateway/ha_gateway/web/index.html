<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>乾坤机枢 · HA 高可用网关</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand" id="brand" title="乾坤机枢 · 双路高可用 · 断流自愈">乾坤机枢</span>
    <span class="dot" id="dot" title="监听状态"></span>
    <span class="addr" id="addr">—</span>
    <span class="proto" id="proto"></span>
    <button class="btn ghost" id="copyAddr">复制地址</button>
    <span class="spacer"></span>
    <label class="follow speed" title="动画速度：同时影响连线流动与数据球"><span>速度</span><input type="range" id="animSpeed" min="0.25" max="3" step="0.25" value="1" /></label>
    <label class="follow" title="连线流动与请求数据球"><input type="checkbox" id="animToggle" checked /> 动画</label>
    <button class="btn ghost" id="refresh">刷新</button>
  </header>

  <main id="main">
    <section class="stage" id="stage">
      <div class="zone zone-up" id="zoneUp"><span class="zone-tag">上游</span></div>
      <div class="zone zone-down" id="zoneDown"><span class="zone-tag">下游</span></div>
      <button class="route-mode" id="routeMode" title="当前路由模式"></button>
      <svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
      <button class="drawer-toggle" id="toggleDrawer" title="管理面板">▶</button>
      <div class="inline-card hidden" id="inline"></div>
      <div class="gw-console hidden" id="gwConsole"></div>
      <div class="legend">
        <span><i class="l-active"></i>当前通道</span>
        <span><i class="l-ready"></i>正常</span>
        <span><i class="l-degraded"></i>降级</span>
        <span><i class="l-down"></i>不可用</span>
        <span><i class="l-ghost"></i>未配置</span>
      </div>
      <div class="empty hidden" id="emptyHint">
        还没有上游通道 —— 点右侧虚线槽位「＋ 新增上游通道」添加一条。
      </div>
    </section>

    <aside class="drawer hidden" id="drawer">
      <div class="drawer-head">
        <span id="dockTitle">管理</span>
      <button class="btn icon" id="closeDrawer" title="收起面板">✕</button>
      </div>
      <div class="drawer-body" id="dockBody"></div>
    </aside>
  </main>

  <div class="splitter" id="splitter" title="拖动调整画布与日志窗格的高度比例"></div>

  <footer class="logpane" id="logpane">
    <div class="log-head">
      <label class="follow"><input type="checkbox" id="logFollow" checked /> 自动跟随滚动</label>
      <span class="spacer"></span>
      <button class="btn ghost" id="logClear">清空</button>
    </div>
    <div class="log-body" id="logBody"></div>
  </footer>

  <script>
    window.addEventListener("error", function (e) {
      var b = document.getElementById("logBody");
      if (!b) return;
      var d = document.createElement("div");
      d.className = "error";
      d.textContent = "[js] " + e.message + " @ " + (e.filename || "") + ":" + (e.lineno || "");
      b.insertBefore(d, b.firstChild);
    });
  </script>
  <script src="/app.js"></script>
</body>
</html>
